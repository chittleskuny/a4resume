<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A4 Resume</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Spectral:wght@600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --toolbar-bg: #1a1a1a;
    --toolbar-fg: #e8e6e1;
    --paper-bg: #fbfaf7;
    --desk-bg: #d5d3ce;
    --sidebar-bg: #f0eeea;
    --sidebar-border: #d8d6d1;
    --accent: #c8553d;
    --accent-hover: #b5482f;
    --block-bg: rgba(100, 100, 100, 0.03);
    --block-border: rgba(100, 100, 100, 0.2);
    --radius: 2px;
  }

  html, body { height: 100%; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--desk-bg);
    color: var(--toolbar-fg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .toolbar {
    background: var(--toolbar-bg);
    height: 52px;
    display: flex;
    align-items: center;
    padding: 0 20px;
    gap: 12px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    z-index: 10;
  }

  .brand {
    font-family: 'IBM Plex Serif', serif;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--toolbar-fg);
    margin-right: 16px;
    user-select: none;
  }
  .brand span { color: var(--accent); }

  .toolbar .divider {
    width: 1px;
    height: 24px;
    background: rgba(255,255,255,0.12);
    margin: 0 4px;
  }

  .toolbar button {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--radius);
    background: transparent;
    color: var(--toolbar-fg);
    cursor: pointer;
    transition: all 0.15s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .toolbar button:hover:not(:disabled) {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.25);
  }
  .toolbar button:active:not(:disabled) {
    transform: translateY(1px);
  }
  .toolbar button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
  }
  .toolbar button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .toolbar button.primary:hover:not(:disabled) {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }
  .toolbar button.secondary {
    background: rgba(255,255,255,0.08);
    border-color: rgba(255,255,255,0.2);
    color: var(--toolbar-fg);
  }
  .toolbar button.secondary:hover:not(:disabled) {
    background: rgba(255,255,255,0.15);
    border-color: rgba(255,255,255,0.3);
  }
  .toolbar button.danger {
    background: #c8553d;
    border-color: #c8553d;
    color: #fff;
  }
  .toolbar button.danger:hover:not(:disabled) {
    background: #b0452f;
    border-color: #b0452f;
  }

  .toolbar button svg {
    width: 14px;
    height: 14px;
    stroke: currentColor;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .path-display {
    margin-left: auto;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.5px;
    user-select: none;
  }

  .fmt-select {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    padding: 5px 6px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--radius);
    background: transparent;
    color: var(--toolbar-fg);
    cursor: pointer;
  }
  .fmt-select:disabled { opacity: 0.3; cursor: not-allowed; }
  .fmt-select option { background: var(--toolbar-bg); color: var(--toolbar-fg); }

  .fmt-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    min-width: 28px;
    padding: 5px 8px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--radius);
    background: transparent;
    color: var(--toolbar-fg);
    cursor: pointer;
  }
  .fmt-btn:hover:not(:disabled) { background: rgba(255,255,255,0.08); }
  .fmt-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .fmt-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  .fmt-color {
    width: 30px;
    height: 28px;
    padding: 2px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--radius);
    background: transparent;
    cursor: pointer;
  }
  .fmt-color:disabled { opacity: 0.3; cursor: not-allowed; }

  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  .sidebar {
    width: 230px;
    min-width: 160px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--sidebar-border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  .sidebar-header {
    padding: 12px 16px 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: rgba(0,0,0,0.35);
    user-select: none;
  }

  .sidebar-tree {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 16px;
  }

  .sidebar-tree::-webkit-scrollbar { width: 5px; }
  .sidebar-tree::-webkit-scrollbar-track { background: transparent; }
  .sidebar-tree::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.1); border-radius: 3px; }

  .tree-item {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 6px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    color: rgba(0,0,0,0.6);
    transition: background 0.1s;
    user-select: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .tree-item:hover { background: rgba(0,0,0,0.05); }
  .tree-item.selected { background: rgba(200,85,61,0.12); color: var(--accent); }

  .tree-icon {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 2px;
  }
  .tree-icon svg { width: 10px; height: 10px; }
  .tree-icon.col-dir { background: #5082b4; }
  .tree-icon.row-dir { background: #50a050; }
  .tree-icon.leaf { background: #999; }

  .tree-indent {
    display: inline-block;
    width: 14px;
    flex-shrink: 0;
  }

  .tree-empty {
    padding: 20px 16px;
    font-size: 12px;
    color: rgba(0,0,0,0.25);
    font-style: italic;
  }

  .desk {
    flex: 1;
    overflow: auto;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }

  .a4 {
    color: #1a1a1a;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px;
    width: 794px;
    min-height: 1123px;
    background: var(--paper-bg);
    box-shadow: 0 2px 20px rgba(0,0,0,0.08), 0 0 1px rgba(0,0,0,0.15);
    padding: 24px;
    position: relative;
    flex-shrink: 0;
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E"),
      var(--paper-bg);
  }

  .block {
    margin: 3px;
    padding: 3px;
    position: relative;
    cursor: pointer;
    border: 1px dashed var(--block-border);
    background: var(--block-bg);
    transition: box-shadow 0.12s ease;
    box-sizing: border-box;
  }
  .block:not([data-dir]) {
    min-height: 1.4em;
    cursor: text;
  }
  .block:not([data-dir]):focus {
    outline: 2px solid var(--accent);
    outline-offset: -1px;
    background: #fff;
  }
  .block[data-dir="row"], .a4[data-dir="row"] {
    display: flex;
    flex-direction: column;
    align-items: stretch;
  }
  .block[data-dir="col"], .a4[data-dir="col"] {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
  [data-dir="col"] > .block {
    flex: 1 1 0%;
    min-width: 0;
  }

  .block[data-border="all"] { border: 1px solid #1a1a1a; }
  .block[data-border="top"] { border-top: 1px solid #1a1a1a; }
  .block[data-border="bottom"] { border-bottom: 1px solid #1a1a1a; }
  .block[data-border="left"] { border-left: 1px solid #1a1a1a; }
  .block[data-border="right"] { border-right: 1px solid #1a1a1a; }

  .block[data-img] {
    min-height: 0;
    cursor: pointer;
  }
  .block[data-img] img {
    display: block;
    max-width: 100%;
    height: auto;
  }

  .block.selected {
    outline: 2px dashed var(--accent);
    outline-offset: -1px;
  }
  .block.selected::after {
    position: absolute;
    top: -1px;
    right: -1px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px;
    font-weight: 500;
    letter-spacing: 0.5px;
    padding: 1px 5px;
    line-height: 1.5;
    color: #fff;
    pointer-events: none;
    z-index: 1;
  }
  .block.selected[data-dir="row"]::after { content: 'ROW'; background: #50a050; }
  .block.selected[data-dir="col"]::after { content: 'COL'; background: #5082b4; }
  .block.selected[data-img]::after { content: 'IMG'; background: #b07020; }

  .block:hover:not(.selected) {
    outline: 1px dashed rgba(0,0,0,0.12);
    outline-offset: -1px;
  }

  .desk::-webkit-scrollbar { width: 8px; }
  .desk::-webkit-scrollbar-track { background: transparent; }
  .desk::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }

  @media print {
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page {
      size: A4;
      margin: 0;
    }
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      background: #fff !important;
      overflow: visible !important;
      height: auto !important;
      display: block !important;
    }
    .toolbar, .sidebar, .tree-empty { display: none !important; }
    .main {
      display: block !important;
      overflow: visible !important;
      height: auto !important;
    }
    .desk {
      overflow: visible !important;
      padding: 0 !important;
      display: block !important;
    }
    .a4 {
      width: 210mm !important;
      min-height: 297mm !important;
      box-shadow: none !important;
      margin: 0 !important;
      padding: 10mm !important;
      background-image: none !important;
      background: #fff !important;
      page-break-after: always;
    }
    .block:not([data-border]) {
      box-shadow: none !important;
      border: none !important;
    }
    .block[data-border] {
      box-shadow: none !important;
    }
    .block.selected {
      outline: none !important;
      box-shadow: none !important;
    }
    .block.selected::after { display: none !important; }
    .block:not([data-dir]):focus {
      outline: none !important;
      background: transparent !important;
    }
  }
</style>
</head>

<script>
(function() {
  'use strict';

  const LS_KEY = 'a4resume_data_v0';
  const btnNew = document.getElementById('btn-new');
  const btnOpen = document.getElementById('btn-open');
  const fileOpen = document.getElementById('file-open');
  const btnSave = document.getElementById('btn-save');
  const btnPrint = document.getElementById('btn-print');
  const btnAddSubRow = document.getElementById('btn-add-sub-row');
  const btnAddSubCol = document.getElementById('btn-add-sub-col');
  const btnMergeWithPrevSib = document.getElementById('btn-merge-with-prev-sib');
  const btnMergeWithNextSib = document.getElementById('btn-merge-with-next-sib');
  const btnImage = document.getElementById('btn-image');
  const fileImage = document.getElementById('file-image');
  const selBlockBorder = document.getElementById('sel-block-border');
  const selBlockBg = document.getElementById('sel-block-bg');
  const selFontName = document.getElementById('sel-font-name');
  const selFontSize = document.getElementById('sel-font-size');
  const btnBold = document.getElementById('btn-bold');
  const btnItalic = document.getElementById('btn-italic');
  const btnUnderline = document.getElementById('btn-underline');
  const selFontColor = document.getElementById('sel-font-color');
  const btnRemove = document.getElementById('btn-remove');
  const tv = document.getElementById('tv');
  const a4 = document.getElementById('a4');

  function alignSidebar() {
    const divSave = document.getElementById('div-save');
    const sidebar = document.querySelector('.sidebar');
    if (divSave && sidebar) {
      const toolbarRect = document.querySelector('.toolbar').getBoundingClientRect();
      const divRect = divSave.getBoundingClientRect();
      sidebar.style.width = (divRect.right - toolbarRect.left) + 'px';
    }
  }
  alignSidebar();
  window.addEventListener('resize', alignSidebar);

  function isBlock(el) {
    return el && el.classList && el.classList.contains('block');
  }
  function getChildBlocks(el) {
    return Array.from(el.children).filter(isBlock);
  }
  function dirOf(el) {
    if (!el || !el.dataset) return null;
    return el.dataset.dir || null;
  }
  function isContenteditable(block) {
    return isBlock(block) && !dirOf(block) && !block.hasAttribute('data-img');
  }
  function isImageBlock(block) {
    return isBlock(block) && block.hasAttribute('data-img');
  }
  function refreshContenteditable() {
    a4.querySelectorAll('.block').forEach(function(b) {
      if (isContenteditable(b)) {
        b.setAttribute('contenteditable', 'true');
      } else {
        b.removeAttribute('contenteditable');
      }
    });
  }

  let selectedEl = null;
  let savedRange = null;

  function select(el) {
    if (selectedEl) selectedEl.classList.remove('selected');
    selectedEl = el;
    if (el) el.classList.add('selected');
    refreshToolbar();
    refreshTreeView();
  }
  function deselect() {
    if (selectedEl) selectedEl.classList.remove('selected');
    selectedEl = null;
    refreshToolbar();
    refreshTreeView();
  }
  function wrapSelection(styleObj) {
    const sel = window.getSelection();
    let range = null;
    if (sel.rangeCount && !sel.getRangeAt(0).collapsed && selectedEl && selectedEl.contains(sel.anchorNode)) {
      range = sel.getRangeAt(0);
    } else if (savedRange && selectedEl && selectedEl.contains(savedRange.commonAncestorContainer)) {
      range = savedRange;
    }
    if (!range || range.collapsed) return;
    const span = document.createElement('span');
    Object.assign(span.style, styleObj);
    try {
      range.surroundContents(span);
    } catch(e) {
      span.appendChild(range.extractContents());
      range.insertNode(span);
    }
    const nr = document.createRange();
    nr.selectNodeContents(span);
    sel.removeAllRanges();
    sel.addRange(nr);
    savedRange = nr.cloneRange();
  }
  function restoreSelection() {
    if (!selectedEl || !isContenteditable(selectedEl)) return false;
    selectedEl.focus();
    if (savedRange && selectedEl.contains(savedRange.commonAncestorContainer)) {
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
      return true;
    }
    return false;
  }

  document.addEventListener('selectionchange', function() {
    const sel = window.getSelection();
    if (sel.rangeCount && !sel.getRangeAt(0).collapsed) {
      const r = sel.getRangeAt(0);
      let p = r.commonAncestorContainer;
      if (p.nodeType !== 1) p = p.parentElement;
      if (p && a4.contains(p) && isContenteditable(p.closest('.block'))) {
        savedRange = r.cloneRange();
      }
    }
  });

  function refreshToolbar() {
    btnRemove.disabled = !selectedEl;
    btnMergeWithNextSib.disabled = !selectedEl;

    selBlockBorder.disabled = !selectedEl;
    selBlockBg.disabled = !selectedEl;

    const contenteditable = selectedEl && isContenteditable(selectedEl);
    const isImg = selectedEl && isImageBlock(selectedEl);
    selFontName.disabled = !contenteditable;
    selFontSize.disabled = !contenteditable;
    btnBold.disabled = !contenteditable;
    btnItalic.disabled = !contenteditable;
    btnUnderline.disabled = !contenteditable;
    selFontColor.disabled = !contenteditable;

    btnImage.disabled = !selectedEl || isImg || (contenteditable && selectedEl.textContent.trim() !== '');

    if (selectedEl) {
      selBlockBorder.value = selectedEl.dataset.border || 'none';
      selBlockBg.value = selectedEl.dataset.bg || '#ffffff';
    }

    if (!selectedEl) {
      btnAddSubRow.disabled = false;
      btnAddSubCol.disabled = true;
      return;
    }

    const curDir = dirOf(selectedEl);
    btnAddSubRow.disabled = isImg || curDir === 'col';
    btnAddSubCol.disabled = isImg || curDir === 'row';

    const siblings = getChildBlocks(selectedEl.parentElement);
    const idx = siblings.indexOf(selectedEl);
    const isTopLevel = selectedEl.parentElement === a4;
    btnMergeWithPrevSib.disabled = !selectedEl || isTopLevel || idx <= 0;
    btnMergeWithNextSib.disabled = !selectedEl || isTopLevel || idx >= siblings.length - 1;

    if (isContenteditable(selectedEl)) {
      try {
        btnBold.classList.toggle('active', document.queryCommandState('bold'));
        btnItalic.classList.toggle('active', document.queryCommandState('italic'));
        btnUnderline.classList.toggle('active', document.queryCommandState('underline'));

        const fn = document.queryCommandValue('fontName');
        selFontName.value = fn ? fn.replace(/^"|"$/g, '') : 'IBM Plex Sans';

        const sel = window.getSelection();
        if (sel.rangeCount) {
          let node = sel.anchorNode;
          if (node && node.nodeType !== 1) node = node.parentElement;
          if (node) {
            const cs = window.getComputedStyle(node);
            const px = Math.round(parseFloat(cs.fontSize));
            const opt = selFontSize.querySelector('option[value="' + px + '"]');
            selFontSize.value = opt ? px : '';
          }
        }
      } catch(e) {}
    }
  }

  function refreshTreeView() {
    tv.innerHTML = '';
    const roots = getChildBlocks(a4);
    if (roots.length === 0) {
      tv.innerHTML = '<div class="tree-empty">None</div>';
      return;
    }
    function buildTree(parent, depth, parentPath) {
      const blocks = getChildBlocks(parent);
      blocks.forEach(function(block, i) {
        const dir = dirOf(block);
        const item = document.createElement('div');
        item.className = 'tree-item' + (selectedEl === block ? ' selected' : '');

        let indents = '';
        for (let d = 0; d < depth; d++) indents += '<span class="tree-indent"></span>';

        const iconClass = isImageBlock(block) ? 'leaf' : dir === 'row' ? 'row-dir' : dir === 'col' ? 'col-dir' : 'leaf';
        const iconSvg = isImageBlock(block)
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>'
          : dir === 'col'
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="9" y1="6" x2="9" y2="18"/><line x1="15" y1="6" x2="15" y2="18"/></svg>'
          : dir === 'row'
          ? '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="6" y1="9" x2="18" y2="9"/><line x1="6" y1="15" x2="18" y2="15"/></svg>'
          : '<svg viewBox="0 0 24 24" fill="#fff"><rect x="8" y="8" width="8" height="8" rx="1"/></svg>';
        const path = parentPath ? parentPath + '.' + (i + 1) : (i + 1) + '';
        const label = path;

        item.innerHTML = indents + '<span class="tree-icon ' + iconClass + '">' + iconSvg + '</span>' + label;
        item.addEventListener('click', function(e) {
          e.stopPropagation();
          select(block);
          block.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
        tv.appendChild(item);

        if (block.children.length > 0) {
          buildTree(block, depth + 1, path);
        }
      });
    }
    buildTree(a4, 0);
  }

  function newA4() {
    a4.innerHTML = '';
    a4.dataset.dir = 'row';
    selectedEl = null;
    savedRange = null;
    const block = document.createElement('div');
    block.className = 'block';
    a4.appendChild(block);
    refreshContenteditable();
    save();
    refreshToolbar();
    refreshTreeView();
  }

  function addSubRow() {
    if (!selectedEl) {
      const block = document.createElement('div');
      block.className = 'block';
      a4.appendChild(block);
      refreshContenteditable();
      select(block);
      save();
      return;
    }
    const curDir = dirOf(selectedEl);
    if (curDir === 'col') return;
    selectedEl.dataset.dir = 'row';
    selectedEl.removeAttribute('contenteditable');
    const block = document.createElement('div');
    block.className = 'block';
    selectedEl.appendChild(block);
    refreshContenteditable();
    select(block);
    save();
  }

  function addSubCol() {
    if (!selectedEl) return;
    const curDir = dirOf(selectedEl);
    if (curDir === 'row') return;
    selectedEl.dataset.dir = 'col';
    selectedEl.removeAttribute('contenteditable');
    const block = document.createElement('div');
    block.className = 'block';
    selectedEl.appendChild(block);
    refreshContenteditable();
    select(block);
    save();
  }

  function mergeWithPrevSib() {
    if (!selectedEl) return;
    const parent = selectedEl.parentElement;
    const siblings = getChildBlocks(parent);
    const idx = siblings.indexOf(selectedEl);
    if (idx <= 0) return;

    const prev = siblings[idx - 1];
    const otherSibs = siblings.filter(function(s, i) { return i !== idx && i !== idx - 1; });
    const parentDir = dirOf(parent);
    const frozen = otherSibs.map(function(s) {
      const r = s.getBoundingClientRect();
      return { el: s, w: r.width, h: r.height };
    });

    while (prev.children.length > 0) {
      selectedEl.insertBefore(prev.children[0], selectedEl.firstChild);
    }
    if (!dirOf(selectedEl) && dirOf(prev)) {
      selectedEl.dataset.dir = dirOf(prev);
    }
    prev.remove();

    frozen.forEach(function(f) {
      if (parentDir === 'col') {
        f.el.style.flex = '0 0 ' + f.w + 'px';
      } else {
        f.el.style.flex = '0 0 ' + f.h + 'px';
      }
    });

    refreshContenteditable();
    save();
    refreshToolbar();
    refreshTreeView();
  }

  function mergeWithNextSib() {
    if (!selectedEl) return;
    const parent = selectedEl.parentElement;
    const siblings = getChildBlocks(parent);
    const idx = siblings.indexOf(selectedEl);
    if (idx < 0 || idx >= siblings.length - 1) return;

    const next = siblings[idx + 1];
    const otherSibs = siblings.filter(function(s, i) { return i !== idx && i !== idx + 1; });
    const parentDir = dirOf(parent);
    const frozen = otherSibs.map(function(s) {
      const r = s.getBoundingClientRect();
      return { el: s, w: r.width, h: r.height };
    });

    while (next.children.length > 0) {
      selectedEl.appendChild(next.children[0]);
    }
    if (!dirOf(selectedEl) && dirOf(next)) {
      selectedEl.dataset.dir = dirOf(next);
    }
    next.remove();

    frozen.forEach(function(f) {
      if (parentDir === 'col') {
        f.el.style.flex = '0 0 ' + f.w + 'px';
      } else {
        f.el.style.flex = '0 0 ' + f.h + 'px';
      }
    });

    refreshContenteditable();
    save();
    refreshToolbar();
    refreshTreeView();
  }

  function remove() {
    if (!selectedEl) return;
    const parent = selectedEl.parentElement;
    selectedEl.remove();
    selectedEl = null;
    if (getChildBlocks(parent).length === 0 && parent !== a4) {
      delete parent.dataset.dir;
    }

    refreshContenteditable();
    save();
    refreshToolbar();
    refreshTreeView();
  }

  btnNew.addEventListener('click', newA4);
  btnAddSubRow.addEventListener('click', addSubRow);
  btnAddSubCol.addEventListener('click', addSubCol);
  btnMergeWithPrevSib.addEventListener('click', mergeWithPrevSib);
  btnMergeWithNextSib.addEventListener('click', mergeWithNextSib);
  btnRemove.addEventListener('click', remove);

  btnImage.addEventListener('click', function() {
    if (!selectedEl || isImageBlock(selectedEl)) return;
    if (isContenteditable(selectedEl) && selectedEl.textContent.trim() !== '') return;
    fileImage.click();
  });
  fileImage.addEventListener('change', function() {
    if (!selectedEl || !fileImage.files.length) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      selectedEl.innerHTML = '';
      const img = document.createElement('img');
      img.src = e.target.result;
      selectedEl.appendChild(img);
      selectedEl.setAttribute('data-img', '');
      selectedEl.removeAttribute('contenteditable');
      save();
      refreshToolbar();
      refreshTreeView();
    };
    reader.readAsDataURL(fileImage.files[0]);
    fileImage.value = '';
  });

  selBlockBorder.addEventListener('change', function() {
    if (!selectedEl) return;
    const val = selBlockBorder.value;
    if (val === 'none') {
      delete selectedEl.dataset.border;
    } else {
      selectedEl.dataset.border = val;
    }
    save();
  });
  selBlockBg.addEventListener('input', function() {
    if (!selectedEl) return;
    selectedEl.dataset.bg = selBlockBg.value;
    selectedEl.style.backgroundColor = selBlockBg.value;
    save();
  });

  selFontName.addEventListener('mousedown', function(e) {
    if (!isContenteditable(selectedEl)) return;
    e.preventDefault();
    if (selFontName.showPicker) selFontName.showPicker();
  });
  selFontName.addEventListener('change', function() {
    if (!isContenteditable(selectedEl) || !selFontName.value) return;
    restoreSelection();
    document.execCommand('fontName', false, selFontName.value);
    refreshToolbar();
    save();
  });
  selFontSize.addEventListener('mousedown', function(e) {
    if (!isContenteditable(selectedEl)) return;
    e.preventDefault();
    if (selFontSize.showPicker) selFontSize.showPicker();
  });
  selFontSize.addEventListener('change', function() {
    if (!isContenteditable(selectedEl) || !selFontSize.value) return;
    restoreSelection();
    document.execCommand('fontSize', false, '7');
    selectedEl.querySelectorAll('font[size="7"]').forEach(function(el) {
      const span = document.createElement('span');
      span.style.fontSize = selFontSize.value + 'px';
      while (el.firstChild) span.appendChild(el.firstChild);
      el.parentNode.replaceChild(span, el);
    });
    refreshToolbar();
    save();
  });
  btnBold.addEventListener('mousedown', function(e) { if(!isContenteditable(selectedEl)) return; e.preventDefault(); });
  btnBold.addEventListener('click', function() {
    if (!isContenteditable(selectedEl)) return;
    restoreSelection();
    document.execCommand('bold');
    refreshToolbar();
    save();
  });
  btnItalic.addEventListener('mousedown', function(e) { if(!isContenteditable(selectedEl)) return; e.preventDefault(); });
  btnItalic.addEventListener('click', function() {
    if (!isContenteditable(selectedEl)) return;
    restoreSelection();
    document.execCommand('italic');
    refreshToolbar();
    save();
  });
  btnUnderline.addEventListener('mousedown', function(e) { if(!isContenteditable(selectedEl)) return; e.preventDefault(); });
  btnUnderline.addEventListener('click', function() {
    if (!isContenteditable(selectedEl)) return;
    restoreSelection();
    document.execCommand('underline');
    refreshToolbar();
    save();
  });
  selFontColor.addEventListener('input', function() {
    if (!isContenteditable(selectedEl)) return;
    restoreSelection();
    wrapSelection({ color: selFontColor.value });
    save();
  });

  btnPrint.addEventListener('click', function() {
    if (selectedEl) selectedEl.classList.remove('selected');
    document.body.classList.add('printing');
    window.print();
    document.body.classList.remove('printing');
    if (selectedEl) selectedEl.classList.add('selected');
  });

  a4.addEventListener('mouseup', refreshToolbar);
  a4.addEventListener('click', function(e) {
    if (isBlock(e.target) && isContenteditable(e.target)) {
      save();
    }
  });
  a4.addEventListener('click', function(e) {
    const target = e.target;
    if (target === a4) { deselect(); return; }
    let block = target;
    while (block && block !== a4 && !isBlock(block)) block = block.parentElement;
    if (isBlock(block)) {
      e.stopPropagation();
      select(block);
      if (isContenteditable(block)) {
      }
    }
  });
  a4.addEventListener('keyup', refreshToolbar);
  a4.addEventListener('input', function() {
    save();
  });

  document.addEventListener('click', function(e) {
    const inSidebar = tv.contains(e.target);
    const inToolbar = document.querySelector('.toolbar').contains(e.target);
    const inA4 = a4.contains(e.target);
    if (!inSidebar && !inToolbar && !inA4) deselect();
  });
  document.addEventListener('keydown', function(e) {
    if (isContenteditable(e.target) && document.activeElement === e.target) {
      if ((e.ctrlKey || e.metaKey) && ['b','i','u'].includes(e.key.toLowerCase())) {
        setTimeout(refreshToolbar, 0);
        setTimeout(save, 0);
        return;
      }
      if (e.key === 'Escape') { e.target.blur(); return; }
      return;
    }
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
    if (e.key === 'Delete' || e.key === 'Backspace') {
      if (selectedEl) { e.preventDefault(); remove(); }
    }
    if (e.key === 'Escape') deselect();
  });

  function serializeA4() {
    function serializeBlock(el) {
      if (!isBlock(el)) return null;
      const node = {
        dir: el.dataset.dir || null,
        border: el.dataset.border || null,
        bg: el.dataset.bg || null,
        img: el.hasAttribute('data-img') ? true : null
      };
      if (node.dir) {
        node.children = Array.from(el.children).filter(isBlock).map(serializeBlock).filter(Boolean);
      } else {
        node.content = el.innerHTML;
      }
      return node;
    }
    return {
      rootDir: a4.dataset.dir || null,
      children: getChildBlocks(a4).map(serializeBlock).filter(Boolean)
    };
  }

  function deserializeA4(a4data) {
    a4.innerHTML = '';

    function deserializeBlock(node) {
      const div = document.createElement('div');
      div.className = 'block';
      if (node.border) div.dataset.border = node.border;
      if (node.bg) { div.dataset.bg = node.bg; div.style.backgroundColor = node.bg; }
      if (node.dir) div.dataset.dir = node.dir;
      if (node.img) div.setAttribute('data-img', '');
      if (node.dir && node.children) {
        node.children.forEach(function(c) {
          div.appendChild(deserializeBlock(c));
        });
      } else if (node.content !== undefined) {
        div.innerHTML = node.content;
      }
      return div;
    }

    if (a4data && Array.isArray(a4data.children) && a4data.children.length > 0) {
      a4.dataset.dir = a4data.rootDir || 'row';
      a4data.children.forEach(function(node) {
        a4.appendChild(deserializeBlock(node));
      });
      return true;
    }
    return false;
  }

  function save() {
    const a4data = serializeA4();
    try { localStorage.setItem(LS_KEY, JSON.stringify(a4data)); } catch(e) {}
  }

  function load(a4data) {
    selectedEl = null;
    savedRange = null;

    const hasData = deserializeA4(a4data);

    if (!hasData) {
      a4.dataset.dir = 'row';
      const block = document.createElement('div');
      block.className = 'block';
      a4.appendChild(block);
    }

    refreshContenteditable();
    refreshToolbar();
    refreshTreeView();
  }

  btnSave.addEventListener('click', async function() {
    save();
    const a4data = serializeA4();
    const json = JSON.stringify(a4data, null, 2);
    const d = new Date();
    const ts = [d.getFullYear() % 100, String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('') + '_' + [String(d.getHours()).padStart(2,'0'), String(d.getMinutes()).padStart(2,'0'), String(d.getSeconds()).padStart(2,'0')].join('');
    if (window.showSaveFilePicker) {
      try {
        const handle = await window.showSaveFilePicker({
          suggestedName: ts + '.a4r',
          types: [{ description: 'A4 Resume', accept: { 'application/json': ['.a4r'] } }]
        });
        const writable = await handle.createWritable();
        await writable.write(json);
        await writable.close();
        return;
      } catch(e) {
        if (e.name === 'AbortError') return;
      }
    }
    const name = prompt('Filename:', ts);
    if (!name) return;
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name.endsWith('.a4r') ? name : name + '.a4r';
    a.click();
    URL.revokeObjectURL(url);
  });

  btnOpen.addEventListener('click', function() {
    fileOpen.click();
  });
  fileOpen.addEventListener('change', function() {
    if (!fileOpen.files.length) return;
    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const a4data = JSON.parse(e.target.result);
        load(a4data);
        save();
      } catch(err) {
        alert('Invalid file format');
      }
    };
    reader.readAsText(fileOpen.files[0]);
    fileOpen.value = '';
  });

  (function init() {
    let a4data;
    try { a4data = JSON.parse(localStorage.getItem(LS_KEY)); } catch(e) {}
    load(a4data);
  })();
})();
</script>
</body>
</html>
